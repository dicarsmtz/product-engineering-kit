# Sanitized Codex config template captured from ~/.codex/config.toml.
# Merge manually into ~/.codex/config.toml if installing this setup on a new machine.

model = "gpt-5.5"

# Install the private startup marketplace from GitHub:
# codex plugin marketplace add dicarsmtz/codex-plugins --ref main
#
# Track repository updates with:
# codex plugin marketplace upgrade codex-plugins
#
# Codex writes the [marketplaces.codex-plugins] config block automatically.
# Do not configure this marketplace as a local clone unless you are testing edits.
#
# Enable the startup plugin with:
# [plugins."startup@codex-plugins"]
# enabled = true

# Official plugin marketplace entries are managed by Codex runtime paths on each machine.
# Keep the enabled plugin declarations, but do not copy machine-specific marketplace source paths.

[plugins."browser-use@openai-bundled"]
enabled = true

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[mcp_servers.notion]
url = "https://mcp.notion.com/mcp"

[mcp_servers.github]
url = "https://api.githubcopilot.com/mcp/"
bearer_token_env_var = "GITHUB_PAT_TOKEN"

[mcp_servers.atlassian]
url = "https://mcp.atlassian.com/v1/mcp/authv2"
